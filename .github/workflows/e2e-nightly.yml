name: E2E Nightly

# Full cross-browser Playwright run (Chromium + Firefox + WebKit). The per-PR CI
# (ci.yml `e2e` job) covers Chromium only for fast feedback; this catches
# browser-specific regressions once a day.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build E2E project
        run: dotnet build PlaywrightTests/PlaywrightTests.csproj --configuration Release

      - name: Install all browsers (+ OS deps)
        run: pwsh PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Run E2E (all browsers)
        run: >-
          dotnet test PlaywrightTests/PlaywrightTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=e2e-full.trx"

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-nightly-results
          path: "**/e2e-full.trx"
